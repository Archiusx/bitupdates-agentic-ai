version: "3.9"

services:
  # Python AI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitupdates-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/bitupdates
      - REDIS_URL=redis://redis:6379
      - APP_ENV=development
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped
    networks:
      - bitupdates-net

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitupdates-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - bitupdates-net

  # MongoDB (local dev - use Atlas in production)
  mongo:
    image: mongo:7.0
    container_name: bitupdates-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitupdates-net

  # Redis (session cache & rate limiting)
  redis:
    image: redis:7-alpine
    container_name: bitupdates-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bitupdates-net

  # Mongo Express (DB admin UI - dev only)
  mongo-express:
    image: mongo-express:latest
    container_name: bitupdates-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=bitupdates123
    depends_on:
      - mongo
    profiles:
      - dev
    networks:
      - bitupdates-net

volumes:
  mongo_data:
    driver: local

networks:
  bitupdates-net:
    driver: bridge
